# Traefik v3 atrás da Cloudflare, com Authenticated Origin Pulls (mTLS).
#
# - Só a porta 443: o redirecionamento HTTP→HTTPS fica na borda da Cloudflare (Always Use HTTPS).
# - Certificados de origem: Cloudflare Origin CA (sem ACME), um por domínio, copiados à mão para ./origin/
#   (cert1.pem + cert1.key, cert2.*, cert3.*).
# - Só aceita tráfego da Cloudflare: ipAllowList + certificado de cliente da Cloudflare (mTLS) + sniStrict.
# - IP real do visitante: forwardedHeaders.trustedIPs com as faixas da Cloudflare (+ Transform Rule X-Real-IP).
# - O socket do Docker fica atrás de um proxy somente leitura, numa rede interna sem saída para a internet.
# - Serviços publicados entram pela rede externa "proxy" com labels traefik.* (exposedByDefault=false).
# - A configuração dinâmica e a CA pública do mTLS vão embutidas (configs), para deploy por URL
#   (por isso sem read_only: o Compose não monta configs embutidos em serviço read_only).
#
# Variáveis: veja .env.example. Guia completo: README.md desta pasta.
name: traefik

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      # Só leitura de containers (o que o provider do Traefik precisa); POST e o resto ficam negados.
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=false
      - --ping=true
      # Entrada interna só do ping/healthcheck (porta 8080, não publicada)
      - --entrypoints.traefik.address=:8080
      - --entrypoints.traefik.http.aliasheadersstrategy=delete
      # Provedores
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      # HTTPS (443): única entrada pública e padrão dos serviços (WebSocket funciona sem configuração extra)
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.forwardedheaders.trustedips=${CF_TRUSTED_IPS:-173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.middlewares=cloudflare-only@file,secure-headers@file
      - --entrypoints.websecure.http.tls=true
    ports:
      - "443:443"
    networks:
      - proxy
      - socket
    volumes:
      # Certificados de origem da Cloudflare (certN.pem + certN.key), copiados à mão; as chaves nunca vão para o Git.
      - ./origin:/etc/traefik/origin:ro
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic/cloudflare.yml
      - source: cloudflare-aop-ca
        target: /etc/traefik/certs/aop-ca.pem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  # Faixas da Cloudflare: https://www.cloudflare.com/ips/ (conferidas em 2026-10-24).
  # Ao atualizar, mude também o padrão de CF_TRUSTED_IPS no command acima.
  traefik-dynamic:
    content: |
      http:
        middlewares:
          cloudflare-only:
            ipAllowList:
              sourceRange:
                - "173.245.48.0/20"
                - "103.21.244.0/22"
                - "103.22.200.0/22"
                - "103.31.4.0/22"
                - "141.101.64.0/18"
                - "108.162.192.0/18"
                - "190.93.240.0/20"
                - "188.114.96.0/20"
                - "197.234.240.0/22"
                - "198.41.128.0/17"
                - "162.158.0.0/15"
                - "104.16.0.0/13"
                - "104.24.0.0/14"
                - "172.64.0.0/13"
                - "131.0.72.0/22"
                - "2400:cb00::/32"
                - "2606:4700::/32"
                - "2803:f800::/32"
                - "2405:b500::/32"
                - "2405:8100::/32"
                - "2a06:98c0::/29"
                - "2c0f:f248::/32"
          secure-headers:
            headers:
              contentTypeNosniff: true
              referrerPolicy: strict-origin-when-cross-origin
              stsSeconds: 31536000
              stsIncludeSubdomains: false
              stsPreload: false
      tls:
        # Certificados de origem da Cloudflare (Origin CA), um por domínio (zona): o Traefik escolhe pelo SNI.
        # Ficam em "certificates" (não só como padrão do store) porque o sniStrict só aceita SNI que case com um
        # certificado desta lista. Para mais domínios, acrescente cert4, cert5... aqui e os arquivos em ./origin/.
        certificates:
          - certFile: /etc/traefik/origin/cert1.pem
            keyFile: /etc/traefik/origin/cert1.key
          - certFile: /etc/traefik/origin/cert2.pem
            keyFile: /etc/traefik/origin/cert2.key
          - certFile: /etc/traefik/origin/cert3.pem
            keyFile: /etc/traefik/origin/cert3.key
        options:
          default:
            minVersion: VersionTLS12
            sniStrict: true
            # Authenticated Origin Pulls (zone-level): só aceita HTTPS com o certificado de cliente
            # assinado pela CA abaixo, carregado na Cloudflare.
            clientAuth:
              caFiles:
                - /etc/traefik/certs/aop-ca.pem
              clientAuthType: RequireAndVerifyClientCert
  # Certificado PÚBLICO da CA própria do Authenticated Origin Pulls (a chave privada nunca entra aqui).
