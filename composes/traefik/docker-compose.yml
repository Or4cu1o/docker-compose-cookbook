# Traefik v3 atrás da Cloudflare, com Authenticated Origin Pulls (mTLS).
#
# - Só a porta 443: o redirecionamento HTTP→HTTPS fica na borda da Cloudflare (Always Use HTTPS).
# - Certificados de origem: Cloudflare Origin CA (sem ACME), um por domínio, e a CA pública do mTLS ficam em
#   ./origin/ no servidor (<domínio>.pem + <domínio>.key, nomes em ORIGIN_CERT_1..3 no .env, e aop-ca.pem),
#   copiados à mão; nada disso vai para o Git.
# - Só aceita tráfego da Cloudflare: ipAllowList + certificado de cliente da Cloudflare (mTLS) + sniStrict.
# - IP real do visitante: forwardedHeaders.trustedIPs com as faixas da Cloudflare (+ Transform Rule X-Real-IP).
# - O socket do Docker fica atrás de um proxy somente leitura, numa rede interna sem saída para a internet.
# - Serviços publicados entram pela rede externa "proxy" com labels traefik.* (exposedByDefault=false).
# - A configuração dinâmica vai embutida (configs), para deploy por URL; os valores ajustáveis vêm do .env
#   (sem read_only: o Compose não monta configs embutidos em serviço read_only).
#
# Variáveis: veja .env.example. Guia completo: README.md desta pasta.
name: traefik

services:
  socket-proxy:
    container_name: traefik-socket-proxy
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      # Só leitura de containers (o que o provider do Traefik precisa); POST e o resto ficam negados.
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    container_name: traefik
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    depends_on:
      - socket-proxy
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=false
      - --ping=true
      # Entrada interna só do ping/healthcheck (porta 8080, não publicada)
      - --entrypoints.traefik.address=:8080
      - --entrypoints.traefik.http.aliasheadersstrategy=delete
      # Provedores
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      # HTTPS (443): única entrada pública e padrão dos serviços (WebSocket funciona sem configuração extra)
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.forwardedheaders.trustedips=${CF_IPS_V4:?defina CF_IPS_V4 no .env},${CF_IPS_V6:?defina CF_IPS_V6 no .env}
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.middlewares=cloudflare-only@file,secure-headers@file
      - --entrypoints.websecure.http.tls=true
    ports:
      - "443:443"
    networks:
      - proxy
      - socket
    volumes:
      # Certificados de origem da Cloudflare (<domínio>.pem + <domínio>.key) e a CA pública do mTLS (aop-ca.pem),
      # copiados à mão; as chaves nunca vão para o Git.
      - ./origin:/etc/traefik/origin:ro
    configs:
      - source: traefik-dynamic
        target: /etc/traefik/dynamic/cloudflare.yml
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  # Os valores vêm do .env: CF_IPS_V4 e CF_IPS_V6 (mesmas listas do trustedIPs), HSTS_SECONDS e TLS_MIN_VERSION.
  traefik-dynamic:
    content: |
      http:
        middlewares:
          cloudflare-only:
            ipAllowList:
              sourceRange: [${CF_IPS_V4},${CF_IPS_V6}]
          secure-headers:
            headers:
              contentTypeNosniff: true
              referrerPolicy: strict-origin-when-cross-origin
              stsSeconds: ${HSTS_SECONDS:-31536000}
              stsIncludeSubdomains: false
              stsPreload: false
      tls:
        # Certificados de origem da Cloudflare (Origin CA), um por domínio (zona): o Traefik escolhe pelo SNI.
        # Ficam em "certificates" (não só como padrão do store) porque o sniStrict só aceita SNI que case com um
        # certificado desta lista. Para mais domínios, acrescente ORIGIN_CERT_4... aqui, no .env e os arquivos em ./origin/.
        certificates:
          - certFile: /etc/traefik/origin/${ORIGIN_CERT_1:?defina ORIGIN_CERT_1 no .env}.pem
            keyFile: /etc/traefik/origin/${ORIGIN_CERT_1:?defina ORIGIN_CERT_1 no .env}.key
          - certFile: /etc/traefik/origin/${ORIGIN_CERT_2:?defina ORIGIN_CERT_2 no .env}.pem
            keyFile: /etc/traefik/origin/${ORIGIN_CERT_2:?defina ORIGIN_CERT_2 no .env}.key
          - certFile: /etc/traefik/origin/${ORIGIN_CERT_3:?defina ORIGIN_CERT_3 no .env}.pem
            keyFile: /etc/traefik/origin/${ORIGIN_CERT_3:?defina ORIGIN_CERT_3 no .env}.key
        options:
          default:
            minVersion: ${TLS_MIN_VERSION:-VersionTLS12}
            sniStrict: true
            # Authenticated Origin Pulls (zone-level): só aceita HTTPS com o certificado de cliente
            # assinado pela CA de ./origin/aop-ca.pem, carregado na Cloudflare.
            clientAuth:
              caFiles:
                - /etc/traefik/origin/aop-ca.pem
              clientAuthType: RequireAndVerifyClientCert

networks:
  # Rede compartilhada com os serviços publicados: declare-a como external no compose deles.
  proxy:
    name: proxy
  # Rede só entre o Traefik e o proxy do socket (sem saída para a internet).
  socket:
    internal: true
